name: VietDoc packaging (Windows, model-free)

# Builds the Windows folder app the way packaging/README.md describes and checks it WITHOUT any model:
# unit tests, the PyInstaller backend, the Electron release build and the internal smoke build, the
# Electron fuses, a scan of both builds for models/documents/secrets/machine paths, a black-box probe of
# the packaged backend (token, Host, Origin, loopback listener, shutdown, stdin watchdog, OCR refused),
# the packaged smoke test with models absent (OCR refused, no Internet connection, no process left behind,
# nothing downloaded) and the release smoke gate (exit code 2).
#
# No VietOCR model, PaddleOCR detector, real document or blind data exists on the runner or is fetched;
# only synthetic PDFs are generated for QA. Pull requests retain reports only. A manual run may create
# a downloadable model-free test installer after every check passes; no GitHub Release is published.
on:
  pull_request:
    branches: [main]
    paths:
      - 'packaging/**'
      - 'desktop/**'
      - 'demo/local_pdf_ocr/**'
      - 'PaddleOCR/**'
      - '.github/workflows/vietdoc-packaging-ci.yml'
  workflow_dispatch:
    inputs:
      download_installer:
        description: Create a downloadable Windows test installer without models
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: vietdoc-packaging-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  tracked-files:
    name: Sensitive tracked files
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: No model weights, documents, labels, private folders or secrets (tree and every PR commit)
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: python .github/scripts/check_tracked_files.py --history-base "origin/$BASE_REF"

  package:
    name: Build and check the packaged app (windows-latest)
    needs: tracked-files
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      DOWNLOAD_INSTALLER: ${{ github.event_name == 'workflow_dispatch' && inputs.download_installer }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'   # the interpreter of the tested build (requirements-packaging.txt)
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            desktop/package-lock.json
            demo/local_pdf_ocr/frontend/package-lock.json

      - name: Build folders outside the checkout
        run: |
          python - <<'PY' >> "$GITHUB_ENV"
          import os
          out = os.path.join(os.environ["RUNNER_TEMP"], "vietdoc-out")
          os.makedirs(os.path.join(out, "report"), exist_ok=True)
          os.makedirs(os.path.join(out, "empty-paddlex"), exist_ok=True)
          print(f"OUT={out}")
          exe = "VietDoc OCR Test.exe" if os.environ["DOWNLOAD_INSTALLER"] == "true" else "VietDoc OCR.exe"
          print(f"RELEASE_EXE={exe}")
          print(f"VPY={os.path.join(os.environ['RUNNER_TEMP'], 'venv-packaging', 'Scripts', 'python.exe')}")
          PY

      - name: Packaging environment (separate venv, pinned versions, PaddleOCR from the vendored folder)
        run: |
          python -m venv "$RUNNER_TEMP/venv-packaging"
          "$VPY" -m pip install -r packaging/backend/requirements-packaging.txt
          git archive --format=tar -o "$OUT/paddleocr-src.tar" HEAD PaddleOCR
          "$VPY" -c "import sys, tarfile; tarfile.open(sys.argv[1]).extractall(sys.argv[2], filter='data')" "$OUT/paddleocr-src.tar" "$OUT/src"
          SETUPTOOLS_SCM_PRETEND_VERSION_FOR_PADDLEOCR=3.8.0.dev13+gdab3fe353 "$VPY" -m pip install --no-deps "$OUT/src/PaddleOCR"
          "$VPY" -m pip check

      - name: Python syntax (warnings are errors)
        run: '"$VPY" -W error -m compileall -q -f demo/local_pdf_ocr desktop/python desktop/scripts packaging .github/scripts'

      - name: Python unit tests - backend, desktop server, packaging tools (skips fail)
        run: |
          "$VPY" .github/scripts/run_backend_tests.py
          for dir in desktop/python/tests packaging/backend packaging/ci packaging/windows packaging/windows/clean_machine; do
            "$VPY" -m unittest discover -v -s "$dir" -p "test_*.py" 2>&1 | tee "$OUT/report/unittest-${dir//\//-}.txt"
            test "${PIPESTATUS[0]}" -eq 0
            if grep -q "skipped=" "$OUT/report/unittest-${dir//\//-}.txt"; then echo "::error::$dir tests were skipped"; exit 1; fi
          done

      - name: Desktop dependencies and the checksum-verified Electron binary
        working-directory: desktop
        run: |
          npm ci --no-audit --no-fund
          node node_modules/electron/install.js

      - name: Electron Node tests - config, minimal backend environment, security rules, smoke gate (skips fail)
        working-directory: desktop
        run: |
          node --test --test-reporter=spec "tests/*.test.js" 2>&1 | tee "$OUT/report/node-tests.txt"
          grep -Eq "^ℹ fail 0$" "$OUT/report/node-tests.txt"
          grep -Eq "^ℹ skipped 0$" "$OUT/report/node-tests.txt"
          grep -Eq "^ℹ todo 0$" "$OUT/report/node-tests.txt"

      - name: Frontend production build
        working-directory: demo/local_pdf_ocr/frontend
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run build
          test -f dist/index.html

      - name: Backend (PyInstaller one-folder)
        run: '"$VPY" -m PyInstaller --noconfirm --clean --distpath "$OUT/backend-dist" --workpath "$OUT/backend-build" packaging/backend/vietdoc-backend.spec'

      - name: Electron release build and internal smoke build (dir target, unsigned, no download)
        shell: pwsh
        working-directory: desktop
        run: |
          $link = Join-Path $PWD 'out\backend\vietdoc-backend'
          if (Test-Path -LiteralPath $link) { throw 'Backend staging path already exists' }
          New-Item -ItemType Directory -Force (Split-Path $link) | Out-Null
          New-Item -ItemType Junction -Path $link -Target (Join-Path $env:OUT 'backend-dist\vietdoc-backend') | Out-Null
          $releaseConfig = 'electron-builder.yml'
          if ($env:DOWNLOAD_INSTALLER -eq 'true') { $releaseConfig = 'electron-builder.windows.yml' }
          try {
            npx electron-builder --win dir --x64 --config $releaseConfig "--config.directories.output=$(Join-Path $env:OUT 'electron-release')"
            if ($LASTEXITCODE) { throw 'release build failed' }
            npx electron-builder --win dir --x64 --config electron-builder.smoke.yml "--config.directories.output=$(Join-Path $env:OUT 'electron-smoke')"
            if ($LASTEXITCODE) { throw 'smoke build failed' }
          } finally {
            # DirectoryInfo.Delete removes only this junction, never its external target.
            $item = Get-Item -LiteralPath $link -ErrorAction SilentlyContinue
            if ($item -and ($item.Attributes -band [IO.FileAttributes]::ReparsePoint)) { $item.Delete() }
          }

      - name: Electron fuses of the release build
        working-directory: desktop
        run: |
          node node_modules/@electron/fuses/dist/bin.js read --app "$OUT/electron-release/win-unpacked/$RELEASE_EXE" | tee "$OUT/report/fuses-release.txt"
          for expected in "RunAsNode is Disabled" "EnableNodeOptionsEnvironmentVariable is Disabled" \
                          "EnableNodeCliInspectArguments is Disabled" "EnableEmbeddedAsarIntegrityValidation is Enabled" \
                          "OnlyLoadAppFromAsar is Enabled" "GrantFileProtocolExtraPrivileges is Disabled"; do
            grep -q "$expected" "$OUT/report/fuses-release.txt" || { echo "::error::fuse not as expected: $expected"; exit 1; }
          done

      - name: Scan both builds - no models, documents, secrets, local config or machine paths; build manifests
        run: |
          # Prebuilt third-party .pyd wheels can embed the hosted runner's profile as PE debug metadata.
          # Only six explicitly identified, byte-identical wheel extensions may contain that one path.
          # Other paths, secrets, model files and documents must still fail closed.
          wheel_root="$("$VPY" -c 'import sysconfig; print(sysconfig.get_path("platlib"))')"
          for build in electron-release electron-smoke; do
            "$VPY" packaging/ci/scan_bundle.py "$OUT/$build/win-unpacked" "$OUT/report/scan-$build" \
              --forbid-string "$GITHUB_WORKSPACE" --forbid-string "$USERPROFILE" --forbid-string "$RUNNER_TEMP" \
              --verified-wheel-root "$wheel_root" --verified-wheel-profile "$USERPROFILE"
          done

      - name: Synthetic PDFs for native text and metadata/Excel QA
        run: |
          "$VPY" desktop/scripts/make_synthetic_pdf.py "$OUT/synthetic.pdf"
          node demo/local_pdf_ocr/frontend/scripts/export_metadata_fixtures.mjs "$OUT/metadata-fixtures"
          "$VPY" desktop/scripts/make_metadata_fixtures.py "$OUT/metadata-fixtures"

      - name: Frozen native OCR libraries (no weights, no inference or listener)
        run: |
          "$VPY" - "$OUT/electron-release/win-unpacked/resources" "$OUT/report/runtime-probe.json" <<'PY'
          import json, secrets, subprocess, sys
          from pathlib import Path
          sys.path.insert(0, str(Path("packaging/ci").resolve()))
          from probe_backend import backend_command, probe_environment
          resources, output = map(Path, sys.argv[1:])
          exe = backend_command(str(resources))
          qa_home = output.parent / "runtime-check-paddlex"
          qa_home.mkdir()
          args = [exe, "--repo-root", str(resources), "--frontend-dist", str(resources / "frontend"),
                  "--model-lock", str(resources / "model_lock.json"), "--paddlex-home", str(qa_home), "--check-runtime"]
          result = subprocess.run(args, input=secrets.token_hex(32) + "\n", text=True, capture_output=True,
                                  cwd=resources, env=probe_environment(exe), timeout=180, encoding="utf-8")
          if result.returncode:
              raise SystemExit(result.stdout + result.stderr)
          line = next((line for line in result.stdout.splitlines() if line.startswith("VIETDOC_RUNTIME ")), None)
          if line is None:
              raise SystemExit("No frozen-runtime diagnostic: " + result.stdout + result.stderr)
          report = json.loads(line.removeprefix("VIETDOC_RUNTIME "))
          assert report["frozen"] is True and report["model_downloads"] == "disabled", report
          assert report["versions"]["paddlepaddle"] == "3.2.0", report
          assert report["versions"]["onnxruntime"] == "1.31.0", report
          output.write_text(json.dumps(report, indent=2), encoding="utf-8")
          print(json.dumps(report))
          PY

      - name: Packaged backend probe - token, Host, Origin, loopback, shutdown, OCR refused without models
        run: '"$VPY" packaging/ci/probe_backend.py "$OUT/electron-smoke/win-unpacked/resources" "$OUT/report/backend-probe.json" "$OUT/synthetic.pdf"'

      - name: Packaged smoke test - no Python/Node on PATH, models absent, no Internet, nothing left running
        working-directory: desktop
        run: |
          smoke="$OUT/report/packaged-smoke"
          "$VPY" ../packaging/ci/watch_run.py --strict --exe "$OUT/electron-smoke/win-unpacked/VietDoc OCR.exe" \
            --out "$smoke" --system32-path --unset VIETDOC_MODEL_ROOT --set "VIETDOC_PADDLEX_HOME=$OUT/empty-paddlex" \
            --timeout 600 -- "--user-data-dir=$smoke/userData" "--smoke-test=$smoke/smoke" "--smoke-pdf=$OUT/synthetic.pdf" "--smoke-batch-dir=$OUT/metadata-fixtures"
          node scripts/check-smoke-report.js "$smoke/smoke/smoke_report.json" --expect=no-models --with-pdf
          "$VPY" scripts/check_excel_export.py "$smoke/smoke/downloads/Danh_sach_van_ban.xlsx" --rows=3 --expected-json="$smoke/smoke/batch_expected.json"
          test -z "$(ls -A "$OUT/empty-paddlex")" || { echo "::error::something was written to the PaddleX folder"; exit 1; }

      - name: Release build refuses the smoke test (exit code 2, nothing started)
        run: |
          gate="$OUT/report/release-gate"
          "$VPY" packaging/ci/watch_run.py --strict --expect-exit 2 --exe "$OUT/electron-release/win-unpacked/$RELEASE_EXE" \
            --out "$gate" --system32-path --timeout 60 -- "--user-data-dir=$gate/userData" "--smoke-test=$gate/smoke"
          test ! -e "$gate/smoke/smoke_report.json"

      # Only an explicit list of reports and manifests is kept: never a build, the Chromium profile (userData),
      # screenshots, logs or OCR exports. The staged copy is scanned for secret-looking content before upload.
      - name: Stage the allowlisted reports and check their content
        id: stage
        if: always()
        run: |
          art="$OUT/artifact"
          mkdir -p "$art"
          cd "$OUT/report"
          for f in unittest-*.txt node-tests.txt fuses-release.txt backend-probe.json runtime-probe.json; do
            if [ -f "$f" ]; then cp "$f" "$art/"; fi
          done
          for b in electron-release electron-smoke; do
            for f in scan.json manifest.tsv; do
              if [ -f "scan-$b/$f" ]; then cp "scan-$b/$f" "$art/scan-$b-$f"; fi
            done
          done
          if [ -f packaged-smoke/run_watch.json ]; then cp packaged-smoke/run_watch.json "$art/packaged-smoke-run-watch.json"; fi
          if [ -f packaged-smoke/smoke/smoke_report.json ]; then cp packaged-smoke/smoke/smoke_report.json "$art/packaged-smoke-report.json"; fi
          if [ -f release-gate/run_watch.json ]; then cp release-gate/run_watch.json "$art/release-gate-run-watch.json"; fi
          ls -la "$art"
          "$VPY" "$GITHUB_WORKSPACE/packaging/ci/scan_bundle.py" "$art" "$OUT/artifact-check"

      - name: Keep reports and build manifests only (never the builds)
        if: always() && steps.stage.outcome == 'success'
        continue-on-error: true  # Evidence only: full artifact storage must not fail a build whose checks passed.
        uses: actions/upload-artifact@v4
        with:
          name: vietdoc-packaging-reports
          retention-days: 14
          if-no-files-found: warn
          path: ${{ env.OUT }}/artifact/

      # Explicit owner-requested test download only. This consumes the exact model-free app that passed
      # the checks above; no private installer, models, labels or source documents are uploaded.
      - name: Build downloadable model-free NSIS installer and verify its payload
        if: github.event_name == 'workflow_dispatch' && inputs.download_installer
        shell: pwsh
        working-directory: desktop
        run: |
          $download = Join-Path $env:OUT 'download'
          $checkedApp = Join-Path $env:OUT 'electron-release\win-unpacked'
          npx electron-builder --win nsis --x64 --prepackaged $checkedApp --config electron-builder.windows.yml "--config.directories.output=$download"
          if ($LASTEXITCODE) { throw 'NSIS installer build failed' }
          $installers = @(Get-ChildItem -LiteralPath $download -File -Filter 'VietDoc-OCR-*-Windows-x64-Setup.exe')
          if ($installers.Count -ne 1) { throw 'Expected exactly one installer' }
          $installer = $installers[0]
          $sevenZip = Join-Path $env:ProgramFiles '7-Zip\7z.exe'
          if (!(Test-Path -LiteralPath $sevenZip)) { throw 'Full 7-Zip is required to inspect NSIS' }
          $outer = Join-Path $env:OUT 'installer-unpacked'
          & $sevenZip x $installer.FullName "-o$outer" -y | Out-Null
          if ($LASTEXITCODE) { throw 'NSIS extraction failed' }
          $payloads = @(Get-ChildItem -LiteralPath $outer -File -Recurse -Filter 'app-64.7z')
          if ($payloads.Count -ne 1) { throw 'Expected exactly one x64 app payload' }
          $payloadApp = Join-Path $env:OUT 'installer-app'
          & $sevenZip x $payloads[0].FullName "-o$payloadApp" -y | Out-Null
          if ($LASTEXITCODE) { throw 'App payload extraction failed' }
          & $env:VPY ../packaging/windows/check_installer_payload.py $checkedApp $payloadApp (Join-Path $env:OUT 'report\installer-payload.json') --exe-name $env:RELEASE_EXE
          if ($LASTEXITCODE) { throw 'Installer payload differs from the checked app' }
          Copy-Item -LiteralPath '../packaging/windows/README.md' -Destination (Join-Path $download 'README.md')
          $hash = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText((Join-Path $download 'SHA256SUMS.txt'), "$hash  $($installer.Name)`n", [Text.UTF8Encoding]::new($false))
          [IO.File]::WriteAllText((Join-Path $download 'BUILD.txt'), "Source commit: $env:GITHUB_SHA`nWindows x64 test installer; unsigned; external models.`n", [Text.UTF8Encoding]::new($false))
          # Keep the download allowlist explicit; builder debug files are build diagnostics only.
          foreach ($file in Get-ChildItem -LiteralPath $download -File) {
            if ($file.Name -notin @($installer.Name, 'README.md', 'SHA256SUMS.txt', 'BUILD.txt')) {
              Remove-Item -LiteralPath $file.FullName
            }
          }

      - name: Downloadable Windows test installer and SHA-256
        if: github.event_name == 'workflow_dispatch' && inputs.download_installer
        uses: actions/upload-artifact@v4
        with:
          name: VietDoc-OCR-Windows-x64
          path: ${{ env.OUT }}/download/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
