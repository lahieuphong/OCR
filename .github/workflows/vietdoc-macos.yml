name: VietDoc macOS DMG (Apple Silicon)

# No run on push to main: a merge is the code its pull request already built, and macOS is the most expensive
# runner by far. Run workflow builds a DMG to download.
on:
  pull_request:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'demo/local_pdf_ocr/**'
      - 'packaging/**'
      - 'PaddleOCR/**'
      - '.github/workflows/vietdoc-macos.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vietdoc-macos-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  dmg:
    name: Build and test native arm64 DMG
    runs-on: macos-15
    timeout-minutes: 120
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      # This job uses ad-hoc signatures only; it has no signing certificate or publishing credential.
      CSC_FOR_PULL_REQUEST: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
          architecture: arm64
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            desktop/package-lock.json
            demo/local_pdf_ocr/frontend/package-lock.json
      - name: Confirm native Apple Silicon and check tracked material
        run: |
          test "$(uname -m)" = arm64
          python .github/scripts/check_tracked_files.py --history-base origin/main
          echo "OUT=$RUNNER_TEMP/vietdoc-macos" >> "$GITHUB_ENV"
          echo "VPY=$RUNNER_TEMP/venv-macos/bin/python" >> "$GITHUB_ENV"
      - name: Native GCC runtime libraries (build input only)
        run: |
          if ! brew list --versions gcc >/dev/null 2>&1; then brew install gcc; fi
          gcc_prefix="$(brew --prefix gcc)"
          gcc_libdir="$(python - "$gcc_prefix" <<'PY'
          from pathlib import Path
          import re, sys
          root = Path(sys.argv[1]) / "lib" / "gcc"
          libdir = root / "current"
          if not libdir.is_dir():
              candidates = [p for p in root.iterdir() if p.is_dir() and re.fullmatch(r"[0-9]+(?:\.[0-9]+)*", p.name)]
              if not candidates:
                  raise SystemExit("No native GCC runtime directory found")
              libdir = max(candidates, key=lambda p: tuple(map(int, p.name.split("."))))
          for name in ("libgomp.1.dylib", "libgcc_s.1.1.dylib"):
              if not (libdir / name).is_file():
                  raise SystemExit(f"Missing native GCC runtime: {name}")
          print(libdir.resolve())
          PY
          )"
          echo "VIETDOC_GCC_LIBDIR=$gcc_libdir" >> "$GITHUB_ENV"
      - name: Native Python runtime (no models)
        run: |
          python -m venv "$RUNNER_TEMP/venv-macos"
          # Paddle 3.2 macOS wheels are on its official CPU index, not PyPI.
          "$VPY" -m pip install paddlepaddle==3.2.0 --index-url https://www.paddlepaddle.org.cn/packages/stable/cpu/
          "$VPY" -m pip install -r packaging/backend/requirements-macos.txt
          mkdir -p "$OUT/src"
          git archive --format=tar -o "$OUT/paddleocr-src.tar" HEAD PaddleOCR
          "$VPY" -c "import sys,tarfile; tarfile.open(sys.argv[1]).extractall(sys.argv[2],filter='data')" "$OUT/paddleocr-src.tar" "$OUT/src"
          SETUPTOOLS_SCM_PRETEND_VERSION_FOR_PADDLEOCR=3.8.0.dev13+gdab3fe353 "$VPY" -m pip install --no-deps "$OUT/src/PaddleOCR"
          "$VPY" -m pip check
      - name: Install locked Electron and frontend dependencies
        run: |
          npm --prefix desktop ci --no-audit --no-fund
          node desktop/node_modules/electron/install.js
          npm --prefix demo/local_pdf_ocr/frontend ci --no-audit --no-fund
      - name: Test, freeze, package, verify and create DMG
        run: bash packaging/macos/build.sh
      # About 350 MB each, so only when the owner asks for one with "Run workflow": keeping one per push
      # and pull request used up the account's artifact storage. Every run still builds and tests the DMG.
      - name: Downloadable test DMG and SHA-256 (no models)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: VietDoc-OCR-macOS-arm64
          path: ${{ env.OUT }}/download/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Build diagnostics (synthetic inputs only)
        if: always()
        continue-on-error: true  # Evidence only: full artifact storage must not fail a build whose checks passed.
        uses: actions/upload-artifact@v4
        with:
          name: VietDoc-macOS-checks
          path: |
            ${{ env.OUT }}/report/*.txt
            ${{ env.OUT }}/report/*.json
            ${{ env.OUT }}/report/scan-*/scan.json
            ${{ env.OUT }}/report/*/run_watch.json
            ${{ env.OUT }}/report/smoke/smoke_report.json
          if-no-files-found: warn
          retention-days: 14
