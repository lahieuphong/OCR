<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'"/>
  <title>VietDoc OCR · Trạng thái hệ thống</title>
  <link rel="stylesheet" href="status.css"/>
</head>
<body>
  <!-- Icons: the app's lucide icons, copied as inline SVG (data-lucide names the icon; the frontend's
       src/test/iconRule.test.jsx checks every one against lucide-react). Rule: docs/UI_ICONS.md. -->
  <main>
    <header class="status-header">
      <span class="brand-mark" aria-hidden="true"><svg class="lucide" data-lucide="scan-text" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/><path d="M7 8h8"/><path d="M7 12h10"/><path d="M7 16h6"/></svg></span>
      <div><h1>VietDoc OCR</h1><p>Bóc tách văn bản hành chính</p></div>
      <span class="offline-label"><svg class="lucide" data-lucide="lock-keyhole" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="16" r="1"/><rect x="3" y="10" width="18" height="12" rx="2"/><path d="M7 10V7a5 5 0 0 1 10 0v3"/></svg>Xử lý trên máy</span>
    </header>
    <section class="status-card" aria-labelledby="status-title">
      <h2 id="status-title">Trạng thái hệ thống</h2>
      <!-- One icon per state, as in the app's update dialog: starting, ready, limited or error. -->
      <p id="message" class="message" role="status">
        <svg class="lucide state-icon starting spin" data-lucide="loader-circle" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>
        <svg class="lucide state-icon ready" data-lucide="circle-check" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg>
        <svg class="lucide state-icon problem" data-lucide="triangle-alert" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>
        <span id="message-text">Đang khởi động…</span>
      </p>
      <dl id="summary" class="summary"></dl>
      <details>
        <summary><svg class="lucide" data-lucide="chevron-right" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>Chi tiết chẩn đoán</summary>
        <dl id="facts"></dl>
        <ul id="problems"></ul>
        <p id="log" class="log"></p>
      </details>
    </section>
    <div class="actions">
      <button id="retry" type="button"><svg class="lucide" data-lucide="rotate-ccw" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg><span>Khởi động lại máy chủ</span></button>
      <button id="logs" type="button"><svg class="lucide" data-lucide="folder-open" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 14 1.5-2.9A2 2 0 0 1 9.24 10H20a2 2 0 0 1 1.94 2.5l-1.54 6a2 2 0 0 1-1.95 1.5H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h3.9a2 2 0 0 1 1.69.9l.81 1.2a2 2 0 0 0 1.67.9H18a2 2 0 0 1 2 2v2"/></svg><span>Mở thư mục nhật ký</span></button>
      <button id="quit" type="button"><svg class="lucide" data-lucide="log-out" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></svg><span>Thoát</span></button>
    </div>
    <p class="privacy-note">Tài liệu được xử lý trên máy. Ứng dụng không tự tải model.</p>
  </main>
  <script src="status.js"></script>
</body>
</html>
